config-version = 2

# Startup
start-at-login = true
after-startup-command = []
auto-reload-config = false

# Window management
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 20
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Keep workspaces available
persistent-workspaces = [
    "1", "2", "3", "4", "5",
    "6", "7", "8", "9"
]

# floating windows
# aerospace list-windows --all --format '%{app-bundle-id} | %{app-name} | %{window-title}'
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Passwords'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.valvesoftware.steam.helper'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = "app"
run = ["layout floating"]

# Gaps
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.right = 8
outer.top = 8
outer.bottom = 8

# ----- Keyboard Bindings -----
[mode.main.binding]
# app short cut
# ctrl-t

# Focus windows (Vim-style)
ctrl-h = 'focus left'
ctrl-j = 'focus down'
ctrl-k = 'focus up'
ctrl-l = 'focus right'

# Move windows
ctrl-shift-h = 'move left'
ctrl-shift-j = 'move down'
ctrl-shift-k = 'move up'
ctrl-shift-l = 'move right'

# Workspaces
ctrl-1 = 'workspace 1'
ctrl-2 = 'workspace 2'
ctrl-3 = 'workspace 3'
ctrl-4 = 'workspace 4'
ctrl-5 = 'workspace 5'
ctrl-6 = 'workspace 6'
ctrl-7 = 'workspace 7'
ctrl-8 = 'workspace 8'
ctrl-9 = 'workspace 9'

# Move windows to workspaces
ctrl-shift-1 = 'move-node-to-workspace 1'
ctrl-shift-2 = 'move-node-to-workspace 2'
ctrl-shift-3 = 'move-node-to-workspace 3'
ctrl-shift-4 = 'move-node-to-workspace 4'
ctrl-shift-5 = 'move-node-to-workspace 5'
ctrl-shift-6 = 'move-node-to-workspace 6'
ctrl-shift-7 = 'move-node-to-workspace 7'
ctrl-shift-8 = 'move-node-to-workspace 8'
ctrl-shift-9 = 'move-node-to-workspace 9'

# Workspace navigation
ctrl-n = 'workspace next'
ctrl-p = 'workspace prev'

# Layout
ctrl-slash = 'layout tiles horizontal vertical'
ctrl-comma = 'layout accordion horizontal vertical'

# Fullscreen
ctrl-f = 'fullscreen'

# Floating / tiling toggle
ctrl-shift-space = 'layout floating tiling'

# Resize
ctrl-minus = 'resize smart -50'
ctrl-equal = 'resize smart +50'

# Close window
ctrl-shift-q = 'close'
